name: Daily offer link check
# Once a day: open every active offer's buy link; an offer whose page is gone/unavailable 3 days in a row
# is archived (noindex + old-offer note + removed from the sitemap) and the homepage / store pages are rebuilt.
# Blocked or unclear answers (403, captcha, timeouts) never count against an offer, and the run changes nothing
# when too many links look dead at once (the stores are probably blocking the checker).
on:
  schedule:
    - cron: "43 2 * * *"   # 02:43 UTC = 05:43 Riyadh, away from the bot's runs
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Only report, do not change anything"
        type: boolean
        default: false
permissions:
  contents: write
concurrency:
  group: rebuild-after-bot
  cancel-in-progress: false
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check links
        run: |
          if [ "${{ inputs.dry_run }}" = "true" ]; then python3 tools/check_links.py --dry-run; exit 0; fi
          python3 tools/check_links.py
      - name: Rebuild generated pages
        if: ${{ inputs.dry_run != true }}
        run: bash tools/rebuild_all.sh
      - name: Commit and push
        if: ${{ inputs.dry_run != true }}
        run: bash tools/push_generated.sh "فحص الروابط اليومي - تحديث العروض المنتهية" data/offers.json sitemap.xml index.html offers
