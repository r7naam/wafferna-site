name: IndexNow ping
# After every push to main, tell Bing and the other IndexNow engines which pages outside offers/ were added or
# changed (articles, hubs, tools, videos), so they are crawled in minutes instead of days. Offer pages are sent
# by the server (~/wafferna-publisher/indexnow_submit.py in cron). Pushes made by the rebuild workflow
# (GITHUB_TOKEN) do not start this one.
on:
  push:
    branches: [main]
    paths: ["**.html"]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: indexnow
  cancel-in-progress: false
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Wait for GitHub Pages to publish the push
        run: sleep 150
      - name: Send changed pages to IndexNow
        run: |
          BEFORE="${{ github.event.before }}"
          [ -z "$BEFORE" ] && BEFORE="${{ github.sha }}~1"
          python3 tools/indexnow.py "$BEFORE" "${{ github.sha }}"
