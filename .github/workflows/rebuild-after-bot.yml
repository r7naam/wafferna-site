name: Rebuild after offers bot
# The offers bot (Wafferna Bot) rewrites the homepage cards block with 6 offers
# and updates data/offers.json. This job restores 21 homepage cards and
# regenerates the Amazon / Noon / AliExpress store pages after each bot push.
on:
  push:
    branches: [main]
    paths: ["data/offers.json", "index.html", "amazon-*.html", "offers/offer-*.html", "tools/**"]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: rebuild-after-bot
  cancel-in-progress: false
jobs:
  rebuild:
    # runs after the offers bot, after a manual upload of an Amazon product page or of the tools, or by hand.
    # the job's own commit never re-triggers it (pushes made with GITHUB_TOKEN do not start workflows).
    if: github.event_name == 'workflow_dispatch' || github.event.head_commit.author.email != 'actions@users.noreply.github.com'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Rebuild homepage hero + cards and store pages
        run: bash tools/rebuild_all.sh
      - name: Commit and push (regenerates on top of main if the bot pushed meanwhile)
        run: bash tools/push_generated.sh "إعادة بناء بطاقات الرئيسية وصفحات المتاجر بعد تحديث العروض" index.html offers/amazon.html offers/noon.html offers/aliexpress.html offers/img "offers/offer-*.html"
